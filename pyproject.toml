[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-stock-etf-backtester"
dynamic = ["version"]
description = "A trustworthy and reproducible HK stock and ETF daily research application."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "exchange-calendars>=4.8,<5",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<2.5",
    "pandas>=2.0,<3",
    "pydantic>=2.10,<3",
    "streamlit>=1.35,<2",
    "uvicorn>=0.30,<1",
    "yfinance>=0.2,<2",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "httpx>=0.27,<1",
    "pip-tools>=7.4,<8",
    "ruff>=0.12,<1",
]
build = [
    "pyinstaller>=6.10,<7",
    "setuptools>=75,<83",
    "wheel>=0.44,<1",
]

[tool.setuptools.dynamic]
version = { attr = "quant_lab.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples", "release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["src/quant_lab"]
omit = ["src/quant_lab/__about__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
]
