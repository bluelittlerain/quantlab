name: Feature request
description: Propose a focused research or engineering improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        QuantLab does not guarantee profit and Phase 1 does not accept live trading,
        brokerage API, credential storage or automatic order-submission features.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the research or engineering problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Explain how the change preserves reproducibility and transparent assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require real orders, brokerage credentials or a profit claim.
          required: true
